<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NES Emulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rgb-primary: 81, 255, 138;
            --rgb-secondary: 74, 199, 255;
            --rgb-accent: 255, 94, 94;
            --rgb-bg: 6, 8, 18;
            --rgb-panel: 12, 18, 34;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            overflow: hidden;
        }

        body {
            margin: 0;
            font-family: "JetBrains Mono", monospace;
            background: transparent;
            color: rgb(231, 248, 238);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.5rem 0 1rem;
        }

        p {
            margin: 0 0 1.25rem;
            color: rgb(161, 177, 201);
            text-align: center;
            max-width: 36rem;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .controls {
            margin-bottom: 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        label.rom-button {
            cursor: pointer;
            padding: 0.6rem 1.4rem;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: rgb(10, 16, 22);
            background: linear-gradient(120deg, rgba(81, 255, 138, 1), rgba(74, 199, 255, 0.92));
            border: none;
            border-radius: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        label.rom-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 199, 255, 0.25);
        }

        input[type="file"] {
            display: none;
        }

        #status {
            font-size: 0.85rem;
            color: rgb(var(--rgb-secondary));
            max-width: 28rem;
            text-align: center;
        }

        #status.error {
            color: rgb(var(--rgb-accent));
        }

        .screen {
            position: relative;
            width: 100%;
            max-width: 768px;
            aspect-ratio: 768 / 720;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(var(--rgb-secondary), 0.35);
            border-radius: 10px;
            background: #000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Recorded footage shown over the canvas until a real ROM is loaded.
           The clip is encoded at 768x720, matching this box exactly, so contain is
           a no-op guard rather than a letterbox. (The build segment's pillarboxing
           is baked into the video itself, not produced here.) */
        .demo-reel {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            border: 1px solid rgba(var(--rgb-secondary), 0.35);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        }

        .demo-badge {
            position: absolute;
            top: 0.7rem;
            left: 0.7rem;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            background: rgba(var(--rgb-bg), 0.82);
            border: 1px solid rgba(var(--rgb-primary), 0.35);
            color: rgb(var(--rgb-primary));
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            pointer-events: none;
        }

        .legend {
            margin-top: 1.5rem;
            padding: 1rem 1.5rem;
            background: linear-gradient(160deg, rgba(var(--rgb-panel), 0.84), rgba(var(--rgb-bg), 0.94));
            border: 1px solid rgba(var(--rgb-secondary), 0.24);
            border-radius: 14px;
            font-size: 0.82rem;
            line-height: 1.6;
            width: 100%;
            max-width: 768px;
        }

        .legend dt {
            font-weight: 700;
            margin-top: 0.6rem;
            color: rgb(var(--rgb-primary));
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.72rem;
        }

        .legend dt:first-child {
            margin-top: 0;
        }

        .legend dd {
            margin: 0.25rem 0 0;
            color: rgb(161, 177, 201);
        }
    </style>
</head>
<body>
    <div class="controls">
        <label class="rom-button" for="rom-input">Choose ROM (.nes)</label>
        <input type="file" id="rom-input" accept=".nes">
        <span id="status">Loading emulator…</span>
    </div>

    <div class="screen">
        <canvas id="canvas" width="768" height="720" tabindex="0"></canvas>
        <video id="demo-reel" class="demo-reel" tabindex="0"
               src="demo.mp4" poster="demo-poster.jpg"
               muted loop playsinline preload="none"
               aria-label="Narrated demo of the NES emulator being built and run"></video>
        <span id="demo-badge" class="demo-badge">Demo reel &mdash; unmute for commentary</span>
    </div>

    <dl class="legend">
        <dt>Controls</dt>
        <dd>Click the game screen first, then use the keyboard.</dd>
        <dd>A — NES A &nbsp;|&nbsp; D — NES B</dd>
        <dd>Arrow keys — D-pad</dd>
        <dd>- — Select &nbsp;|&nbsp; = — Start</dd>
        <dt>Supported mappers</dt>
        <dd>Mapper 0 (NROM) and Mapper 3 (CNROM)</dd>
    </dl>

    <script>
        var statusEl = document.getElementById('status');
        var canvasEl = document.getElementById('canvas');
        var runtimeReady = false;
        var lastError = '';

        function setStatus(text, isError) {
            statusEl.textContent = text;
            statusEl.classList.toggle('error', !!isError);
        }

        var Module = {
            canvas: canvasEl,
            onRuntimeInitialized: function () {
                runtimeReady = true;
                setStatus('Ready — choose a ROM', false);
            },
            printErr: function (text) {
                lastError = String(text).trim();
                console.error(text);
            },
            onAbort: function (reason) {
                setStatus('Emulator aborted: ' + (lastError || reason || 'unknown error'), true);
            }
        };
    </script>
    <script src="nes.js"></script>
    <script>
        // Mappers the C++ core supports. The WASM build has no -fexceptions, so an
        // unsupported mapper makes the C++ Bus constructor throw, which aborts the
        // whole runtime (every later ROM fails until a page reload). We mirror the
        // header/mapper checks here in JS so load_rom is only ever called with a ROM
        // the core can actually handle.
        var SUPPORTED_MAPPERS = [0, 3];

        function validateRom(bytes) {
            if (
                bytes.length < 16 ||
                bytes[0] !== 0x4e || // 'N'
                bytes[1] !== 0x45 || // 'E'
                bytes[2] !== 0x53 || // 'S'
                bytes[3] !== 0x1a
            ) {
                return { ok: false, message: 'Not a valid iNES (.nes) ROM file' };
            }

            var mapperId = ((bytes[7] >> 4) << 4) | (bytes[6] >> 4);
            if (SUPPORTED_MAPPERS.indexOf(mapperId) === -1) {
                return {
                    ok: false,
                    message:
                        'Unsupported mapper ' +
                        mapperId +
                        ' — only mapper 0 (NROM) and 3 (CNROM) are supported',
                };
            }

            return { ok: true };
        }

        function loadRomFile(file) {
            if (!runtimeReady) {
                setStatus('Emulator not ready yet — try again in a moment', true);
                return;
            }

            setStatus('Loading ' + file.name + '…', false);
            lastError = '';

            var reader = new FileReader();
            reader.onload = function () {
                var bytes = new Uint8Array(reader.result);

                var check = validateRom(bytes);
                if (!check.ok) {
                    setStatus(check.message, true);
                    return;
                }

                try {
                    try {
                        Module.FS.unlink('/rom.nes');
                    } catch (e) {
                        // first upload
                    }
                    Module.FS.writeFile('/rom.nes', bytes);
                    var ok = Module.ccall('load_rom', 'number', ['string'], ['/rom.nes']);
                    if (ok) {
                        onRomRunning(file);
                    } else {
                        setStatus(
                            lastError ||
                                'Failed to load ROM (unsupported mapper, invalid file, or SDL init failed)',
                            true
                        );
                    }
                } catch (err) {
                    // Emscripten throws an 'unwind' sentinel when load_rom starts the
                    // SDL main loop (simulate_infinite_loop). That's success, not an error.
                    if (err === 'unwind' || (err && err.message === 'unwind')) {
                        onRomRunning(file);
                    } else {
                        var message =
                            (err && err.message) || lastError || String(err) || 'unknown error';
                        setStatus('Error: ' + message, true);
                    }
                }
            };
            reader.onerror = function () {
                setStatus('Failed to read file', true);
            };
            reader.readAsArrayBuffer(file);
        }

        // Most visitors arrive without a .nes file. Until a real ROM loads we play
        // recorded footage of the emulator over the canvas, so the page always shows
        // the thing working rather than an empty black screen.
        var demoReel = document.getElementById('demo-reel');
        var demoBadge = document.getElementById('demo-badge');
        var screenEl = document.querySelector('.screen');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var canHover = window.matchMedia('(hover: hover)').matches;

        function hideDemoReel() {
            if (!demoReel) return;
            demoReel.pause();
            demoReel.removeAttribute('src');
            demoReel.load(); // release the decoded buffer
            demoReel.style.display = 'none';
            if (demoBadge) {
                demoBadge.style.display = 'none';
            }
            // The screen is the emulator's hot interaction surface from here on;
            // stop toggling controls on a hidden element every time it is hovered.
            if (screenEl) {
                screenEl.removeEventListener('mouseenter', onScreenEnter);
                screenEl.removeEventListener('mouseleave', onScreenLeave);
            }
            demoReel.removeEventListener('focus', onReelFocus);
            demoReel.removeEventListener('blur', onReelBlur);
            demoReel.removeEventListener('playing', onReelPlaying);
            if (reelObserver) {
                reelObserver.disconnect();
                reelObserver = null;
            }
        }

        // Both load_rom success paths end up here: the normal truthy return and the
        // 'unwind' sentinel Emscripten throws once the SDL main loop takes over.
        function onRomRunning(file) {
            hideDemoReel();
            canvasEl.focus();
            setStatus('Running: ' + file.name, false);
        }

        // Controls are pinned on whenever we cannot rely on hover to reveal them, or
        // once autoplay has been refused -- otherwise a blocked autoplay leaves a
        // poster with no visible affordance saying it is even a video.
        var reelPinned = reduceMotion || !canHover;
        var reelHovered = false;
        var reelFocused = false;
        // Distinguishes "we paused because it scrolled away" from "the visitor
        // pressed pause", so scrolling back does not override a deliberate pause.
        var reelPausedByScroll = false;
        // That distinction only means anything once playback has actually started:
        // before then the reel is paused simply because nothing has played it yet.
        var reelEverPlayed = false;
        var reelObserver = null;

        // play() predates promises in older engines, where it returns undefined.
        function playReel() {
            var started = demoReel.play();
            if (started && started.catch) {
                started.catch(pinReelControls);
            }
        }

        function onReelPlaying() {
            reelEverPlayed = true;
        }

        function syncReelControls() {
            demoReel.controls = reelPinned || reelHovered || reelFocused;
        }

        function pinReelControls() {
            reelPinned = true;
            syncReelControls();
        }

        function onScreenEnter() {
            reelHovered = true;
            syncReelControls();
        }

        function onScreenLeave() {
            reelHovered = false;
            syncReelControls();
        }

        function onReelFocus() {
            reelFocused = true;
            syncReelControls();
        }

        function onReelBlur() {
            reelFocused = false;
            syncReelControls();
        }

        if (demoReel) {
            syncReelControls();
            demoReel.addEventListener('playing', onReelPlaying);

            if (!reduceMotion) {
                if ('IntersectionObserver' in window) {
                    // preload="none" means nothing is fetched until this fires.
                    reelObserver = new IntersectionObserver(function (entries) {
                        entries.forEach(function (entry) {
                            if (!demoReel.getAttribute('src')) return;
                            if (entry.isIntersecting) {
                                if (reelEverPlayed && demoReel.paused && !reelPausedByScroll) return;
                                reelPausedByScroll = false;
                                playReel();
                            } else if (!demoReel.paused) {
                                reelPausedByScroll = true;
                                demoReel.pause();
                            }
                        });
                    }, { threshold: 0.25 });
                    reelObserver.observe(demoReel);
                } else {
                    playReel();
                }
            }

            if (canHover) {
                screenEl.addEventListener('mouseenter', onScreenEnter);
                screenEl.addEventListener('mouseleave', onScreenLeave);
                demoReel.addEventListener('focus', onReelFocus);
                demoReel.addEventListener('blur', onReelBlur);
            }
        }

        document.getElementById('rom-input').addEventListener('change', function (event) {
            var file = event.target.files[0];
            if (file) {
                loadRomFile(file);
            }
        });
    </script>
</body>
</html>
